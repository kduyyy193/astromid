    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="200" cy="120" r="180" fill="#F27D26" opacity="0.12" filter="url(#blur)"/>
  <circle cx="980" cy="520" r="220" fill="#F27D26" opacity="0.08" filter="url(#blur)"/>
  <text x="600" y="300" text-anchor="middle" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="72" font-weight="700" letter-spacing="-0.02em">AstroMind</text>
  <text x="600" y="380" text-anchor="middle" fill="#F27D26" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="600" letter-spacing="0.35em" text-transform="uppercase">AI Astrology Guide</text>
  <text x="600" y="440" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="400">Birth chart · Gemini · EN / VI</text>
</svg>
